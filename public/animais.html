<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animais — Patas & Cia</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header><a href="/">🐾 Patas &amp; Cia</a><nav><a href="/">Tutores</a><a href="/agenda.html">Agenda</a></nav></header>
  <main>
    <div class="card">
      <h1 id="tutor-nome">Animais</h1>
      <p class="sub" id="tutor-info"></p>
      <div id="alerta" class="alerta"></div>
      <a class="btn sec peq" href="/">← Voltar para tutores</a>
    </div>

    <div class="card">
      <h2>Animais cadastrados</h2>
      <table>
        <thead><tr><th>Nome</th><th>Espécie</th><th>Raça</th><th>Sexo</th><th>Nascimento</th><th></th></tr></thead>
        <tbody id="corpo"></tbody>
      </table>
    </div>

    <div class="card">
      <h2 id="form-titulo">Novo animal</h2>
      <form id="form" novalidate>
        <input type="hidden" name="id">
        <div class="grade">
          <div class="campo">
            <label for="nome">Nome *</label>
            <input id="nome" name="nome" maxlength="80">
            <span class="erro" data-erro="nome"></span>
          </div>
          <div class="campo">
            <label for="especie">Espécie *</label>
            <input id="especie" name="especie" list="especies" maxlength="30" placeholder="Cão, Gato...">
            <datalist id="especies"><option>Cão</option><option>Gato</option><option>Ave</option><option>Coelho</option><option>Roedor</option><option>Réptil</option></datalist>
            <span class="erro" data-erro="especie"></span>
          </div>
          <div class="campo">
            <label for="raca">Raça</label>
            <input id="raca" name="raca" maxlength="60">
            <span class="erro" data-erro="raca"></span>
          </div>
          <div class="campo">
            <label for="sexo">Sexo *</label>
            <select id="sexo" name="sexo">
              <option value="">Selecione...</option>
              <option value="M">Macho</option>
              <option value="F">Fêmea</option>
            </select>
            <span class="erro" data-erro="sexo"></span>
          </div>
          <div class="campo">
            <label for="data_nascimento">Data de nascimento</label>
            <input id="data_nascimento" name="data_nascimento" type="date">
            <span class="erro" data-erro="data_nascimento"></span>
          </div>
          <div class="campo">
            <label for="observacoes">Observações</label>
            <input id="observacoes" name="observacoes" maxlength="255">
            <span class="erro" data-erro="observacoes"></span>
          </div>
        </div>
        <button class="btn" type="submit">Salvar</button>
        <button class="btn sec" type="button" id="cancelar">Limpar / cancelar edição</button>
      </form>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/animais.js"></script>
</body>
</html>
